# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Notes Hub
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: koders-lab.github.io/notes-hub
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Space Grotesk
      body: Inter
      code: JetBrains Mono
    colors:
      # ── ACTIVE: Everforest (warm, eye-comfort) ──────────────────
      # To switch palettes: swap the hex values below with one of the
      # alternates in the commented block at the bottom of colors.
      lightMode:
        light: "#fdf6e3"          # Everforest light bg — warm cream
        lightgray: "#e6e2cc"
        gray: "#a6b0a0"
        darkgray: "#5c6a72"       # soft slate body text
        dark: "#4c5a5f"           # headers
        secondary: "#8da101"      # muted moss accent
        tertiary: "#93b259"
        highlight: "rgba(141, 161, 1, 0.10)"
        textHighlight: "#dfa00088"
      darkMode:
        light: "#2d353b"          # Everforest dark bg — soft forest charcoal
        lightgray: "#3d484d"
        gray: "#7a8478"
        darkgray: "#d3c6aa"       # warm sand text — signature Everforest fg
        dark: "#e6e2cc"           # headers
        secondary: "#a7c080"      # soft sage green, low glare
        tertiary: "#83c092"
        highlight: "rgba(167, 192, 128, 0.12)"
        textHighlight: "#dbbc7f40"
      # ══════════════════════════════════════════════════════════════
      # ALTERNATE PALETTES — to use one, copy its values up into the
      # lightMode/darkMode blocks above. Keep "Use Quartz Themes" OFF.
      # ══════════════════════════════════════════════════════════════
      #
      # ── OPTION 2: Warm Paper + Dusty Blue (most neutral, Apple-Books-ish) ──
      # lightMode:
      #   light: "#faf6ee"          # warm paper, not white
      #   lightgray: "#e7e0d3"
      #   gray: "#a89f8d"
      #   darkgray: "#4a4640"       # soft ink body text
      #   dark: "#33302a"           # headers — warm near-black
      #   secondary: "#7a95a8"      # dusty blue accent
      #   tertiary: "#93a9b8"
      #   highlight: "rgba(122, 149, 168, 0.10)"
      #   textHighlight: "#e8d9a888"
      # darkMode:
      #   light: "#1c1b19"          # warm charcoal, not black
      #   lightgray: "#302e2a"
      #   gray: "#6b665d"
      #   darkgray: "#cfc9bd"       # warm off-white text
      #   dark: "#ece7db"           # headers
      #   secondary: "#8fa9bb"      # soft dusty blue, low glare
      #   tertiary: "#7089a0"
      #   highlight: "rgba(143, 169, 187, 0.12)"
      #   textHighlight: "#c9b87d40"
      #
      # ── OPTION 3: Sage (muted green, softer than Everforest) ──────────────
      # lightMode:
      #   light: "#faf6ee"
      #   lightgray: "#e7e0d3"
      #   gray: "#a89f8d"
      #   darkgray: "#4a4640"
      #   dark: "#33302a"
      #   secondary: "#5c7a6b"      # muted sage accent
      #   tertiary: "#8a9b83"
      #   highlight: "rgba(92, 122, 107, 0.10)"
      #   textHighlight: "#e8d9a888"
      # darkMode:
      #   light: "#1c1b19"
      #   lightgray: "#302e2a"
      #   gray: "#6b665d"
      #   darkgray: "#cfc9bd"
      #   dark: "#ece7db"
      #   secondary: "#9db89f"      # soft sage, low glare
      #   tertiary: "#7d9a86"
      #   highlight: "rgba(157, 184, 159, 0.12)"
      #   textHighlight: "#c9b87d40"
      #
      # ── OPTION 4: Solarized (classic low-contrast, blue-green cast) ───────
      # lightMode:
      #   light: "#fdf6e3"          # solarized base3
      #   lightgray: "#eee8d5"      # base2
      #   gray: "#93a1a1"           # base1
      #   darkgray: "#586e75"       # base01 body
      #   dark: "#073642"           # base02 headers
      #   secondary: "#268bd2"      # solarized blue
      #   tertiary: "#2aa198"       # cyan
      #   highlight: "rgba(38, 139, 210, 0.10)"
      #   textHighlight: "#b5890088"
      # darkMode:
      #   light: "#002b36"          # base03 bg
      #   lightgray: "#073642"      # base02
      #   gray: "#586e75"           # base01
      #   darkgray: "#93a1a1"       # base1 text
      #   dark: "#eee8d5"           # base2 headers
      #   secondary: "#268bd2"      # blue
      #   tertiary: "#2aa198"       # cyan
      #   highlight: "rgba(38, 139, 210, 0.12)"
      #   textHighlight: "#b5890040"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: false
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
    options: {}
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
